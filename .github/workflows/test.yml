name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  odoo:
    runs-on: ubuntu-latest
    container:
      image: odoo:18.0
      options: --user root
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Jalankan tes FoodTrace
        run: scripts/run-tests.sh --db_host=postgres --db_port=5432 --db_user=odoo --db_password=odoo
